<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Трапеза</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<style>

/* ==========================================================================
   ТРАПЕЗА · български рецепти
   Стъклото е направено по примерите: слабо размазване + насищане на цвета
   отзад + изкривяване (SVG филтър #glass-distort) + слоеве вътрешни сенки.
   Работи най-добре в Chrome/Chromium.
   Основният цвят се сменя от страницата с настройки (--h = нюанс 0–360).
   Две стъкла: „Леко“ (CSS) и „Силно“ (WebGL, клас gl-on на <html>).
   ========================================================================== */
@property --a1{syntax:"<angle>";inherits:false;initial-value:-75deg}
@property --a2{syntax:"<angle>";inherits:false;initial-value:-45deg}
@property --p{syntax:"<number>";inherits:false;initial-value:1}

:root{
  --font-display:'Unbounded','Onest','Segoe UI',system-ui,sans-serif;
  --font-body:'Onest','Inter','Segoe UI',system-ui,-apple-system,sans-serif;

  --h:355;                                   /* нюанс на основния цвят (червен) */
  --accent:hsl(var(--h) 90% 56%);
  --accent-ink:hsl(var(--h) 100% 66%);       /* акцент върху фона на страницата */
  --accent-glass:hsl(var(--h) 100% 68%);     /* акцент върху стъкло */
  --on-accent:#fff;

  --bg:#050505;
  --fg:#ffffff;
  --fg-muted:#c2c2c2;
  --grid:rgba(255,255,255,.05);
  --grid-major:rgba(255,255,255,.09);

  /* фонова сцена зад стъклото */
  --b1:var(--accent);
  --b2:#3b3b3b;
  --b3:#262626;
  --b4:hsl(var(--h) 80% 28%);
  --b5:rgba(255,255,255,.55);

  /* стъкло */
  --c-glass:#bbbbbc;
  --c-light:#fff;
  --c-dark:#000;
  --rl:.9;                                   /* сила на светлите ръбове */
  --rd:2;                                    /* сила на тъмните ръбове */
  --sat:150%;
  --tint:color-mix(in srgb,#0d0d10 56%,transparent);
  --tint-thin:color-mix(in srgb,var(--c-glass) 14%,transparent);
  --tint-sheet:color-mix(in srgb,#0b0b0d 90%,transparent);
  --capsule:color-mix(in srgb,#0a0a0c 62%,transparent);
  --on-glass:#ffffff;
  --on-glass-muted:#c0c0c0;
  --on-glass-dim:#8d8d8d;
  --inset:rgba(0,0,0,.4);
  --media-bg:#070707;
  --line:rgba(255,255,255,.14);
  --line-soft:rgba(255,255,255,.06);
  --solid-bg:#ffffff;
  --solid-fg:#000000;
  --edge:rgba(5,5,5,.8);
  --scrim:rgba(0,0,0,.72);
  --ring:var(--accent-ink);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#d3d7da;
  --fg:#0a0a0a;
  --fg-muted:#3b4247;
  --grid:rgba(0,0,0,.06);
  --grid-major:rgba(0,0,0,.11);
  --accent-ink:hsl(var(--h) 85% 36%);
  --accent-glass:hsl(var(--h) 85% 38%);
  --b2:#ffffff;
  --b3:#ffffff;
  --b4:hsl(var(--h) 85% 82%);
  --b5:rgba(0,0,0,.45);
  --rl:1;
  --rd:1;
  --tint:color-mix(in srgb,#ffffff 46%,transparent);
  --tint-thin:color-mix(in srgb,#ffffff 30%,transparent);
  --tint-sheet:color-mix(in srgb,#f3f5f6 92%,transparent);
  --capsule:color-mix(in srgb,#ffffff 72%,transparent);
  --on-glass:#101216;
  --on-glass-muted:#444c52;
  --on-glass-dim:#6b747a;
  --inset:rgba(255,255,255,.55);
  --media-bg:#e4e8ea;
  --line:rgba(0,0,0,.14);
  --line-soft:rgba(0,0,0,.07);
  --solid-bg:#0a0a0a;
  --solid-fg:#ffffff;
  --edge:rgba(255,255,255,.82);
  --scrim:rgba(20,24,28,.55);
  color-scheme:light;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 1rem/1.55 var(--font-body);-webkit-font-smoothing:antialiased;min-height:100%;overflow-x:clip;transition:background .4s,color .4s}
img{max-width:100%;display:block}
[hidden]{display:none!important}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:3px}
mark{background:var(--accent);color:var(--on-accent);border-radius:4px;padding:0 .15em}
.sr{position:absolute;width:1px;height:1px;margin:-1px;border:0;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(100%);white-space:nowrap}

/* ---------- Фон: смели форми (чинии), за да има какво да огъва стъклото ---------- */
.bg-art{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden}
.bg-art svg{width:100%;height:100%;display:block}
.bg-art .b1{fill:var(--b1)}
.bg-art .b2{fill:none;stroke:var(--b2);stroke-width:90}
.bg-art .b3{fill:var(--b3)}
.bg-art .b4{fill:var(--b4)}
.bg-art .b5{fill:none;stroke:var(--b5);stroke-width:2}
.bg-art g{transform-box:fill-box;animation:drift 46s ease-in-out infinite alternate}
.bg-art g:nth-child(2){animation-duration:58s;animation-delay:-12s}
.bg-art g:nth-child(3){animation-duration:52s;animation-delay:-30s}
.bg-art g:nth-child(4){animation-duration:64s;animation-delay:-8s}
.bg-art g:nth-child(5){animation-duration:70s;animation-delay:-22s}
@keyframes drift{from{transform:translate(-36px,-22px)}to{transform:translate(42px,30px)}}
.bg-grid{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),linear-gradient(var(--grid-major) 1px,transparent 1px),linear-gradient(90deg,var(--grid-major) 1px,transparent 1px);
  background-size:56px 56px,56px 56px,280px 280px,280px 280px}

.wrap{width:100%;max-width:1180px;margin-inline:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ==========================================================================
   Стъкло
   ========================================================================== */
:root{
  --gshadow:
    inset 0 0 0 1px color-mix(in srgb,var(--c-light) calc(var(--rl) * 10%),transparent),
    inset 1.8px 3px 0 -2px color-mix(in srgb,var(--c-light) calc(var(--rl) * 90%),transparent),
    inset -2px -2px 0 -2px color-mix(in srgb,var(--c-light) calc(var(--rl) * 80%),transparent),
    inset -3px -8px 1px -6px color-mix(in srgb,var(--c-light) calc(var(--rl) * 60%),transparent),
    inset -.3px -1px 4px 0 color-mix(in srgb,var(--c-dark) calc(var(--rd) * 12%),transparent),
    inset -1.5px 2.5px 0 -2px color-mix(in srgb,var(--c-dark) calc(var(--rd) * 20%),transparent),
    inset 0 3px 4px -2px color-mix(in srgb,var(--c-dark) calc(var(--rd) * 20%),transparent),
    inset 2px -6.5px 1px -4px color-mix(in srgb,var(--c-dark) calc(var(--rd) * 10%),transparent),
    0 1px 5px 0 color-mix(in srgb,var(--c-dark) calc(var(--rd) * 10%),transparent),
    0 8px 22px -4px color-mix(in srgb,var(--c-dark) calc(var(--rd) * 12%),transparent);
  --cshadow:
    inset 0 0 0 1px color-mix(in srgb,var(--c-light) calc(var(--rl) * 26%),transparent),
    inset 0 1px 0 color-mix(in srgb,var(--c-light) calc(var(--rl) * 42%),transparent),
    0 3px 8px -3px color-mix(in srgb,var(--c-dark) calc(var(--rd) * 18%),transparent);
  --tshadow:
    inset 0 0 0 1px color-mix(in srgb,var(--c-light) calc(var(--rl) * 10%),transparent),
    inset 2px 1px 0 -1px color-mix(in srgb,var(--c-light) calc(var(--rl) * 90%),transparent),
    inset -1.5px -1px 0 -1px color-mix(in srgb,var(--c-light) calc(var(--rl) * 80%),transparent),
    inset -2px -6px 1px -5px color-mix(in srgb,var(--c-light) calc(var(--rl) * 60%),transparent),
    inset -1px 2px 3px -1px color-mix(in srgb,var(--c-dark) calc(var(--rd) * 20%),transparent),
    inset 0 -4px 1px -2px color-mix(in srgb,var(--c-dark) calc(var(--rd) * 10%),transparent),
    0 3px 6px 0 color-mix(in srgb,var(--c-dark) calc(var(--rd) * 8%),transparent);
}
.glass{--r:28px;position:relative;isolation:isolate;border-radius:var(--r);color:var(--on-glass);
  background-color:var(--tint);
  -webkit-backdrop-filter:blur(8px) saturate(var(--sat));
          backdrop-filter:blur(8px) saturate(var(--sat));
  box-shadow:var(--gshadow);
  transition:background-color .4s,box-shadow .4s}
.glass.thin{background-color:var(--tint-thin)}
/* с изкривяване (SVG филтър), само в Chromium */
.glass.rf{backdrop-filter:blur(8px) url(#glass-distort) saturate(var(--sat))}
/* светлина при курсора */
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:3;opacity:0;transition:opacity .25s;
  background:radial-gradient(240px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.14),transparent 65%)}
@media (hover:hover){.glass:hover::after{opacity:1}}

/* Преход между светла и тъмна тема */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-old(root){z-index:1}
::view-transition-new(root){z-index:2}

/* Фиксирана горна лента */
.top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;margin-inline:auto;z-index:50;display:flex;align-items:center;justify-content:space-between;padding-block:12px;pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font:600 1.15rem/1 var(--font-display);letter-spacing:-.01em}
.brand .logo{--r:50%;width:46px;height:46px;display:grid;place-items:center}
.brand .logo svg{width:28px;height:28px}
.tools{display:flex;align-items:center;gap:10px}
.iconbtn{--r:50%;width:56px;height:56px;display:grid;place-items:center;border:0;cursor:pointer;padding:0}
.iconbtn svg{width:22px;height:22px}
.iconbtn[aria-expanded="true"] svg{color:var(--accent-glass)}
.iconbtn svg path{stroke-linejoin:round}

/* Превключвател за темата (стъклен, с плъзгащ се палец) */
.switcher{--r:99em;display:flex;align-items:center;gap:6px;width:130px;height:56px;margin:0;border:0;padding:6px 8px 8px}
.so{position:relative;display:flex;align-items:center;justify-content:center;width:54px;height:100%;border-radius:99em;cursor:pointer;color:var(--on-glass-dim);transition:color .16s}
.so:has(input:checked){color:var(--accent-glass);cursor:default}
.so svg{width:22px;height:22px;transition:scale .2s cubic-bezier(.5,0,0,1)}
.so:has(input:checked) svg{scale:1}
/* Само една иконка е в основния цвят: текущата, а при посочване само посочената */
@media (hover:hover){
  .so:hover{color:var(--accent-glass)}
  .so:hover svg{scale:1.18}
  .switcher:hover .so:has(input:checked):not(:hover){color:var(--on-glass-dim)}
}
.si{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.so:has(.si:focus-visible){outline:2px solid var(--ring);outline-offset:2px}
.switcher::after{content:"";position:absolute;left:2px;top:4px;width:66px;height:calc(100% - 8px);inset:auto;inset-inline-start:2px;border-radius:99em;
  background:var(--capsule);box-shadow:var(--tshadow);z-index:-1;opacity:1;pointer-events:none}
.switcher:hover::after{opacity:1}
.switcher:has(.si[c-option="1"]:checked)::after{translate:0 0;transition:translate .4s cubic-bezier(1,0,.4,1);animation:stretch .44s ease}
.switcher:has(.si[c-option="2"]:checked)::after{translate:60px 0;transition:translate .4s cubic-bezier(1,0,.4,1);animation:stretch .44s ease}
@keyframes stretch{0%,100%{scale:1 1}50%{scale:1.14 1}}

/* Страница с настройки */
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.sw{width:34px;height:34px;border-radius:50%;border:0;padding:0;cursor:pointer;background:hsl(var(--sh) 90% 56%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),0 2px 6px rgba(0,0,0,.3);transition:transform .15s}
.sw:hover{transform:scale(1.1)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--on-glass)}
.hue{display:block;margin-bottom:16px}
.hue input{-webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:99px;margin:0;cursor:pointer;
  background:linear-gradient(90deg,hsl(0 90% 56%),hsl(60 90% 56%),hsl(120 90% 56%),hsl(180 90% 56%),hsl(240 90% 56%),hsl(300 90% 56%),hsl(360 90% 56%));box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.hue input::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.25),0 2px 6px rgba(0,0,0,.4)}
.hue input::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.25),0 2px 6px rgba(0,0,0,.4)}

/* Типография */
h1{margin:0;font:600 clamp(2.1rem,1.1rem + 4vw,4rem)/1.06 var(--font-display);letter-spacing:-.03em;text-wrap:balance}
h2,h3{text-wrap:balance}
.lead{max-width:48ch;color:var(--fg-muted);font-size:1.075rem;margin:16px 0 0}

/* Страници */
.page{position:relative;isolation:isolate;overflow-x:clip;padding-top:84px;padding-bottom:190px}
.page.enter{animation:pageIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(10px) scale(.992)}to{opacity:1;transform:none}}
.phead{position:relative;padding-block:26px 8px}

/* Ръбове при скрол, като в iOS */
.edge{position:fixed;left:0;right:0;z-index:40;pointer-events:none;opacity:0;transition:opacity .35s}
.edge.on{opacity:1}
.edge-top{top:0;height:calc(96px + env(safe-area-inset-top,0px));
  background:linear-gradient(var(--edge),transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  -webkit-mask-image:linear-gradient(#000 40%,transparent);mask-image:linear-gradient(#000 40%,transparent)}
.edge-bot{bottom:0;height:calc(150px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,var(--edge),transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  -webkit-mask-image:linear-gradient(to top,#000 40%,transparent);mask-image:linear-gradient(to top,#000 40%,transparent)}

/* Ленти с филтри */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-block:28px 22px}
.bar .sep{width:1px;height:26px;background:var(--grid-major);margin-inline:4px}
.count{margin-left:auto;color:var(--fg-muted);font-variant-numeric:tabular-nums}
.chip{--r:999px;appearance:none;border:0;cursor:pointer;font:500 .92rem/1 var(--font-body);padding:.78rem 1.1rem;transition:transform .15s,background-color .3s}
.chip{box-shadow:var(--cshadow)}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background-color:var(--solid-bg);color:var(--solid-fg)}

/* Бутони (по примера с въртящия се ръб и проблясък) */
.btn{--bw:clamp(1px,.07em,3px);all:unset;box-sizing:border-box;position:relative;display:inline-flex;cursor:pointer;border-radius:999px;color:var(--on-glass);text-decoration:none;
  background:linear-gradient(-75deg,rgba(255,255,255,.06),rgba(255,255,255,.22),rgba(255,255,255,.06)),var(--tint);
  -webkit-backdrop-filter:blur(4px) saturate(var(--sat));backdrop-filter:blur(4px) saturate(var(--sat));
  box-shadow:inset 0 .125em .125em rgba(0,0,0,.08),inset 0 -.125em .125em rgba(255,255,255,.45),0 .25em .125em -.125em rgba(0,0,0,.25),0 0 .1em .25em inset rgba(255,255,255,.14);
  transition:transform .4s cubic-bezier(.25,1,.5,1),box-shadow .4s cubic-bezier(.25,1,.5,1)}
.btn:hover{transform:scale(.975)}
.btn:active{transform:scale(.955)}
.btn:focus-visible{outline:2px solid var(--ring);outline-offset:3px}
.btn::after{content:"";position:absolute;z-index:1;inset:calc(var(--bw) / -2);border-radius:inherit;padding:var(--bw);pointer-events:none;
  background:conic-gradient(from var(--a1) at 50% 50%,rgba(0,0,0,.5),rgba(0,0,0,0) 5% 40%,rgba(0,0,0,.5) 50%,rgba(0,0,0,0) 60% 95%,rgba(0,0,0,.5)),linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.5));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;
  transition:--a1 .5s ease}
.btn:hover::after{--a1:-125deg}
.btn:active::after{--a1:-75deg}
.bt{position:relative;display:inline-flex;align-items:center;gap:.6rem;padding:.95rem 1.35rem;font:600 .95rem/1 var(--font-body);letter-spacing:-.01em;user-select:none}
.bt svg{width:18px;height:18px}
.bt::after{content:"";position:absolute;inset:var(--bw);border-radius:999px;pointer-events:none;z-index:2;mix-blend-mode:screen;
  background:linear-gradient(var(--a2),rgba(255,255,255,0) 0%,rgba(255,255,255,.5) 40% 50%,rgba(255,255,255,0) 55%);background-size:200% 200%;background-position:0% 50%;background-repeat:no-repeat;
  transition:background-position .5s cubic-bezier(.25,1,.5,1),--a2 .5s cubic-bezier(.25,1,.5,1)}
.btn:hover .bt::after{background-position:25% 50%}
.btn:active .bt::after{background-position:50% 15%;--a2:-15deg}
.btn.primary{color:var(--on-accent);
  background:linear-gradient(-75deg,rgba(255,255,255,0),rgba(255,255,255,.24),rgba(255,255,255,0)),var(--accent);
  box-shadow:inset 0 .125em .125em rgba(0,0,0,.12),inset 0 -.125em .125em rgba(255,255,255,.4),0 .35em .8em -.3em var(--accent),0 0 .1em .25em inset rgba(255,255,255,.16)}

/* Малки елементи */
.pill{display:inline-flex;align-items:center;gap:8px;font:500 .85rem/1 var(--font-body);padding:.5rem .85rem;border-radius:999px;background:var(--inset);color:var(--on-glass);box-shadow:inset 0 0 0 1px var(--line)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;color:var(--on-glass-muted);font-size:.9rem}
.meta span{display:inline-flex;align-items:center;gap:7px}
.meta svg{width:16px;height:16px}
.lvl{display:inline-flex;gap:3px}
.lvl i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.lvl i.on{background:var(--accent)}
.ic{display:block}

/* Медия (снимка или чинийка) */
.media{position:relative;margin:8px 8px 0;border-radius:20px;overflow:hidden;aspect-ratio:16/10;background-color:var(--media-bg);
  background-image:linear-gradient(var(--line-soft) 1px,transparent 1px),linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);background-size:20px 20px;
  box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.media .plate,.s-media .plate{position:absolute;inset:0;margin:auto;height:84%;width:auto;aspect-ratio:1;color:var(--on-glass)}
.badge{position:absolute;left:10px;bottom:10px;display:inline-flex;align-items:center;gap:6px;padding:.38rem .7rem;border-radius:999px;background:var(--tint-sheet);color:var(--on-glass);font:500 .8rem/1 var(--font-body);box-shadow:inset 0 0 0 1px var(--line);font-variant-numeric:tabular-nums}
.badge svg{width:14px;height:14px;color:var(--accent-glass)}

/* Карти с рецепти */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:20px}
.card{--r:28px;display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.2,.9,.3,1),background-color .4s,box-shadow .4s}
.card:hover{transform:translateY(-4px)}
.card-body{padding:16px 20px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.card h3{margin:0;font:600 1.2rem/1.25 var(--font-body)}
.card h3 a{text-decoration:none}
.card h3 a::before{content:"";position:absolute;inset:0;z-index:2;border-radius:inherit}
.card p{margin:0;color:var(--on-glass-muted);font-size:.95rem}
.card .meta{margin-top:auto;padding-top:4px}

 en:{name:'Stuffed aubergines',lead:'Baked aubergine halves filled with minced meat and tomatoes under a kashkaval cheese crust.',tags:'aubergine eggplant mince kashkaval oven',
     ing:['Aubergines','Minced meat','Onion','Tomatoes','Garlic','Oil','Paprika','Kashkaval cheese','Parsley','Salt','Black pepper'],
     steps:['Heat the oven to 200°C. Halve the aubergines lengthwise, score the flesh in a crosshatch pattern and sprinkle with salt.','Leave them to release their bitter juice, then pat dry with a towel.','Brush the aubergines with some of the oil, place them cut side up in a tray and bake until softened.','Fry the finely chopped onion in the remaining oil, add the minced meat, crushed garlic and paprika and fry until the meat crumbles. Add the grated tomatoes and simmer.','Carefully scoop out the middle of the aubergines, chop it finely and return it to the filling. Fill the aubergines with it.','Sprinkle with grated kashkaval and bake until a golden crust forms. Serve with parsley.']}},

}

  let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))>>>0;
  const a=h%360;
  return `<svg class="plate" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-opacity=".22" stroke-width="1"/><circle cx="50" cy="50" r="36" fill="currentColor" fill-opacity=".05" stroke="currentColor" stroke-opacity=".4" stroke-width="1"/><circle cx="50" cy="50" r="22" fill="none" stroke="currentColor" stroke-opacity=".28" stroke-width="1" stroke-dasharray="2 3"/><g transform="rotate(${a} 50 50)"><path d="M50 6a44 44 0 0 1 31.1 12.9" fill="none" style="stroke:var(--accent)" stroke-width="2.4" stroke-linecap="round"/></g></svg>`;
}
const mediaInner=r=>plate(r.id)+(PHOTOS[r.id]?`<img src="${esc(PHOTOS[r.id])}" alt="${esc(rName(r))}" loading="lazy" onerror="this.remove()">`:'');

/* Количества */
function nf(v){const s=String(Math.round(v*10)/10);return L==='en'?s:s.replace('.',',')}
function frac(v){const w=Math.floor(v),f=Math.round((v-w)*4)/4,m={0:'',.25:'¼',.5:'½',.75:'¾'};if(f>=1)return String(w+1);return (w?String(w):'')+m[f]||'0'}
const UEN={'г':'g','мл':'ml','ч.л.':'tsp','с.л.':'tbsp'};
function unitLabel(u,v){
  if(!u)return '';
  if(L==='bg')return u;
  if(u==='бр.')return v>1?'pcs':'pc';
  return UEN[u]||u;
}
function amount(a,u,s){
  if(a==null)return t('to_taste');
  let v=a*s;
  if(u==='г'||u==='мл'){
    if(v>=1000)return nf(v/1000)+nbsp+(u==='г'?(L==='en'?'kg':'кг'):(L==='en'?'l':'л'));
    v=v<20?Math.round(v):v<100?Math.round(v/5)*5:Math.round(v/10)*10;
    return v+nbsp+unitLabel(u,v);
  }
  v=Math.round(v*4)/4;if(v===0)v=.25;
  return frac(v)+(u?nbsp+unitLabel(u,v):'');
}

/* Маркиране на търсената дума */
function hl(s,q){
  if(!q)return esc(s);
  const toks=q.split(/\s+/).filter(Boolean).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  if(!toks.length)return esc(s);
  const re=new RegExp('('+toks.join('|')+')','gi');
  return s.split(re).map((p,i)=>i%2?`<mark>${esc(p)}</mark>`:esc(p)).join('');
}

/* ---------- Търсене ---------- */
const sst={q:'',meals:new Set(),fast:false,veg:false,fav:false};
const NM=[['k','flame','n_kcal','kcal',10],['p','drumstick','n_protein','g',1],['c','wheat','n_carbs','g',1],['f','drop','n_fat','g',1]];
const NR={};   /* границите от реалните рецепти */
NM.forEach(([k,,,,st])=>{const v=R.map(r=>r.nut[k]);NR[k]=[Math.floor(Math.min(...v)/st)*st,Math.ceil(Math.max(...v)/st)*st]});
const nv={};NM.forEach(([k])=>nv[k]=NR[k].slice());   /* текущи стойности на плъзгачите */
const nActive=k=>nv[k][0]>NR[k][0]||nv[k][1]<NR[k][1];
let nopen=null;
const pctOf=(k,v)=>(v-NR[k][0])/(NR[k][1]-NR[k][0])*100;
const unitOf=u=>u==='kcal'?t('kcal'):t('g');
const rangeText=k=>{const u=NM.find(x=>x[0]===k)[3];return `${nv[k][0]}–${nv[k][1]}${nbsp}${unitOf(u)}`};

function nutItemHTML([k,icon,nk,u,st]){
  const name=t(nk);
  return `<div class="nitem glass thin rf" data-n="${k}" data-open="false" data-has="false">
    <button class="nhead" type="button" aria-expanded="false" aria-label="${esc(t('nf_filter',name))}" title="${esc(name)}">${ic(icon)}<span class="ndot"></span></button>
    <span class="nsum" data-sum></span>
    <div class="npanel" role="group" aria-label="${esc(name)}">
      <div class="ntop"><span class="ntl">${esc(name)}<button class="nreset" type="button" data-nreset="${k}">${t('reset')}</button></span><output data-out></output></div>
      <div class="rng" data-rng="${k}">
        <span class="rtrack"></span><span class="rfill"></span>
        <button class="rthumb" type="button" role="slider" data-h="0" aria-label="${esc(name+': '+t('nf_min'))}" aria-valuemin="${NR[k][0]}" aria-valuemax="${NR[k][1]}"></button>
        <button class="rthumb" type="button" role="slider" data-h="1" aria-label="${esc(name+': '+t('nf_max'))}" aria-valuemin="${NR[k][0]}" aria-valuemax="${NR[k][1]}"></button>
      </div>
    </div></div>`;
}
function syncNut(k){
  const it=$(`.nitem[data-n="${k}"]`);if(!it)return;
  const [lo,hi]=nv[k],on=nActive(k);
  it.dataset.has=on;
  $('[data-sum]',it).textContent=rangeText(k);
  $('[data-out]',it).textContent=rangeText(k);
  const rng=$('.rng',it);
  rng.style.setProperty('--lo',pctOf(k,lo));rng.style.setProperty('--hi',pctOf(k,hi));
  const th=$$('.rthumb',rng);
  th[0].style.setProperty('--v',pctOf(k,lo));th[1].style.setProperty('--v',pctOf(k,hi));
  th[0].setAttribute('aria-valuenow',lo);th[1].setAttribute('aria-valuenow',hi);
  th[0].setAttribute('aria-valuetext',lo+' '+unitOf(NM.find(x=>x[0]===k)[3]));th[1].setAttribute('aria-valuetext',hi+' '+unitOf(NM.find(x=>x[0]===k)[3]));
}
function toggleNut(k){
  nopen=nopen===k?null:k;
  $$('.nitem').forEach(it=>{const o=it.dataset.n===nopen;it.dataset.open=o;$('.nhead',it).setAttribute('aria-expanded',o)});
}
function setNut(k,which,val){
  const st=NM.find(x=>x[0]===k)[4];
  val=Math.round(val/st)*st;
  const [mn,mx]=NR[k];
  if(which===0)nv[k][0]=Math.max(mn,Math.min(val,nv[k][1]));
  else nv[k][1]=Math.min(mx,Math.max(val,nv[k][0]));
  syncNut(k);renderSearch();
}

function buildSearch(){
  const q0=$('#q')?$('#q').value:sst.q;
  $('#page-tarsene').innerHTML=`<div class="wrap"><header class="phead"><h1>${t('search_h')}</h1><p class="lead">${t('search_lead')}</p></header>
    <form class="searchbar" id="sForm" role="search" style="margin-top:26px"><div class="sfield glass thin rf">${ic('search')}<input id="q" type="search" placeholder="${esc(t('search_ph'))}" aria-label="${esc(t('search_aria'))}" autocomplete="off" value="${esc(q0)}"></div></form>
    <div class="bar" role="group" aria-label="${esc(t('filters'))}">
      ${chip('m','all',t('all'),true)}${MKEYS.map(k=>chip('m',k,mealName(k))).join('')}<span class="sep" aria-hidden="true"></span>
      ${chip('s','fast',t('fast'))}${chip('s','veg',t('veg'))}${chip('s','fav',t('fav'))}
    </div>
    <p class="nlabel" id="nlabel">${t('nf_group')}</p>
    <div class="nrow" role="group" aria-labelledby="nlabel">${NM.map(nutItemHTML).join('')}</div>
    <p class="count" style="margin:0 0 18px" data-count aria-live="polite"></p>
    <div class="grid" data-grid></div></div>`;
  NM.forEach(([k])=>syncNut(k));
  if(nopen){const it=$(`.nitem[data-n="${nopen}"]`);if(it){it.dataset.open=true;$('.nhead',it).setAttribute('aria-expanded',true)}}
  renderSearch();
}
function renderSearch(){
  const pg=$('#page-tarsene'), q=sst.q.trim().toLowerCase(), toks=q.split(/\s+/).filter(Boolean);
  const hay=r=>{
    const en=r.en||{name:'',lead:'',tags:'',ing:[]};
    return (r.name+' '+r.lead+' '+r.tags+' '+en.name+' '+en.lead+' '+(en.tags||'')+' '+MKEYS.map(k=>r.meal===k?T.bg['nav_'+k]+' '+T.en['nav_'+k]:'').join('')+' '+(r.veg?'вегетарианско vegetarian':'')+' '+r.ing.map(i=>i[0]).join(' ')+' '+en.ing.join(' ')).toLowerCase();
  };
  const okN=r=>NM.every(([k])=>!nActive(k)||(r.nut[k]>=nv[k][0]&&r.nut[k]<=nv[k][1]));
  let Ls=R.filter(r=>(!sst.meals.size||sst.meals.has(r.meal))&&(!sst.fast||r.time<=30)&&(!sst.veg||r.veg)&&(!sst.fav||isFav(r.id))&&okN(r)&&toks.every(x=>hay(r).includes(x)));
  const score=r=>toks.some(x=>(r.name+' '+(r.en?r.en.name:'')).toLowerCase().includes(x))?0:1;
  Ls.sort((a,b)=>score(a)-score(b)||a.time-b.time);
  let html;
  if(Ls.length)html=Ls.map(r=>card(r,q)).join('');
  else if(sst.fav&&!q)html=emptyBox(t('empty_fav_h'),t('empty_fav_p'));
  else html=emptyBox(t('no_match_h'),t('no_match_p'));
  $('[data-grid]',pg).innerHTML=html;
  $('[data-count]',pg).textContent=`${Ls.length} ${rec(Ls.length)}`+(q?t('for_q',sst.q.trim()):'');
  $$('[data-m]',pg).forEach(b=>b.setAttribute('aria-pressed',b.dataset.m==='all'?sst.meals.size===0:sst.meals.has(b.dataset.m)));
  $$('[data-s]',pg).forEach(b=>b.setAttribute('aria-pressed',!!sst[b.dataset.s]));
}

const fsel=new Set(['yayca','sirene','kiselo','domati','krastavici','luk']);
function buildFridge(){
  const groups=FRIDGE.map(g=>`<div class="fgroup"><h2>${t('g_'+g.code)}</h2><div class="chips">${g.keys.map(k=>chip('k',k,esc(fName(k)),fsel.has(k))).join('')}</div></div>`).join('');
  $('#page-hladilnik').innerHTML=`<div class="wrap"><header class="phead"><h1>${t('fr_h')}</h1><p class="lead">${t('fr_lead')}</p></header>
    ${groups}
    <div class="fsum"><span>${t('fr_selected')}: <strong id="fcount">0</strong></span>${btn(t('fr_clear'),'id="fclear"')}<span>${t('fr_note')}</span></div>
    <div class="fres" id="fres" aria-live="polite"></div></div>`;
  renderFridge();
}
function renderFridge(){
  const pg=$('#page-hladilnik');
  $$('[data-k]',pg).forEach(b=>b.setAttribute('aria-pressed',fsel.has(b.dataset.k)));
  $('#fcount').textContent=fsel.size;
  const out=$('#fres');
  if(!fsel.size){out.innerHTML=emptyBox(t('fr_empty_h'),t('fr_empty_p'));return}
  const rows=R.map(r=>{
    const keys=[...new Set(r.ing.map(i=>i[3]).filter(k=>FKEYS.has(k)))];
    const have=keys.filter(k=>fsel.has(k)),miss=keys.filter(k=>!fsel.has(k));
    return {r,keys,have,miss,pct:keys.length?have.length/keys.length:0};
  }).filter(x=>x.have.length).sort((a,b)=>b.pct-a.pct||a.miss.length-b.miss.length||a.r.time-b.r.time);
  if(!rows.length){out.innerHTML=emptyBox(t('fr_none_h'),t('fr_none_p'));return}
  const ready=rows.filter(x=>!x.miss.length).length;
  out.innerHTML=`<p style="margin:0;color:var(--fg-muted)">${t('fr_ready')}: <strong style="color:var(--fg)">${ready}</strong> ${rec(ready)}</p>`+rows.map(x=>`
    <article class="frow glass"><div class="media">${mediaInner(x.r)}</div>
      <div><h3><a href="#r-${x.r.id}">${esc(rName(x.r))}</a></h3><small>${x.miss.length?t('fr_missing')+': '+x.miss.map(k=>esc(fName(k).toLowerCase())).join(', '):t('fr_all')}</small>${nutLine(x.r,false)}</div>
      <div class="fmeter"><span class="segs" aria-hidden="true">${x.keys.map(k=>`<i class="seg ${fsel.has(k)?'on':''}"></i>`).join('')}</span><span>${t('fr_of',x.have.length,x.keys.length)}</span></div>
    </article>`).join('');
}

        <ol class="steps">${r.steps.map((s,i)=>`<li><button class="chk" type="button" aria-pressed="false" aria-label="${esc(t('step_done',i+1))}"><span class="n">${i+1}</span>${ic('check')}</button><div class="st"><p>${esc(rStep(r,i))}</p>${s[1]?`<button class="tm" type="button" data-min="${s[1]}">${ic('clock')}<span>${t('timer')} ${s[1]}${nbsp}${t('min')}</span></button>`:''}</div></li>`).join('')}</ol></section>
    </div></div>`;
}
const ingList=(r,serv)=>r.ing.map((i,x)=>`<li><span>${esc(rIng(r,x))}</span><b>${amount(i[1],i[2],serv/r.serv)}</b></li>`).join('');

function settingsHTML(){
  const sw=SWATCHES.map(([h,k])=>`<button class="sw" type="button" data-h="${h}" style="--sh:${h}" aria-pressed="${h===hue}" aria-label="${esc(t(k))}" title="${esc(t(k))}"></button>`).join('');
  const gd=glassFail?t('glass_unavail'):(glassMode==='strong'?t('glass_strong_d'):t('glass_light_d'));
  return `<div class="sheet glass rf setsheet">
    <div class="sheet-actions"><div><button class="xbtn" type="button" id="xclose" aria-label="${esc(t('close'))}">${ic('close')}</button></div></div>
    <div class="s-head"><h2>${t('set_title')}</h2></div>
    <div class="setgrid">
      <section class="sblock" aria-labelledby="sb1"><h3 id="sb1">${t('set_color')}</h3>
        <div class="swatches" id="swatches" role="group" aria-labelledby="sb1">${sw}</div>
        <div class="rng hrng" data-hrng><span class="htrack"></span><button class="rthumb hthumb" type="button" role="slider" aria-label="${esc(t('set_hue'))}" aria-valuemin="0" aria-valuemax="360" aria-valuenow="${hue}" style="--v:${hue/3.6}"></button></div></section>
      <section class="sblock" aria-labelledby="sb2"><h3 id="sb2">${t('set_lang')}</h3>
        <div class="opts" role="group" aria-labelledby="sb2">${chip('lang','bg',t('lang_bg'),L==='bg')}${chip('lang','en',t('lang_en'),L==='en')}</div></section>
      <section class="sblock" aria-labelledby="sb3"><h3 id="sb3">${t('set_glass')}</h3>
        <div class="opts" role="group" aria-labelledby="sb3">${chip('glass','light',t('glass_light'),glassMode==='light')}${chip('glass','strong',t('glass_strong'),glassMode==='strong')}</div>
        <p class="sdesc" id="gdesc">${gd}</p></section>
    </div></div>`;
}

function openOverlay(kind,html,label){
  closeToken++;
  const wasOpen=sheetOpen;
  lastFocus=wasOpen?lastFocus:document.activeElement;
  ov.setAttribute('aria-label',label);
  ov.innerHTML=html;
  ovKind=kind;
  ov.hidden=false;document.body.classList.add('locked');ov.scrollTop=0;sheetOpen=true;
  $('#gearBtn').setAttribute('aria-expanded',kind==='settings');
  if(!reduce&&!wasOpen){
    const sh=$('.sheet',ov),b=sh.getBoundingClientRect();
    ov.animate([{opacity:0},{opacity:1}],{duration:260,easing:'ease-out'});
    if(lastRect&&b.width&&b.height){
      const sx=Math.max(.2,lastRect.width/b.width),sy=Math.max(.05,lastRect.height/b.height);
      sh.animate([{transformOrigin:'0 0',transform:`translate(${lastRect.left-b.left}px,${lastRect.top-b.top}px) scale(${sx},${sy})`,opacity:.15},{transformOrigin:'0 0',transform:'none',opacity:1}],{duration:500,easing:'cubic-bezier(.2,.85,.25,1)'});
    }else sh.animate([{transform:'scale(.96)',opacity:0},{transform:'none',opacity:1}],{duration:380,easing:'cubic-bezier(.2,.85,.25,1)'});
  }
  setTimeout(()=>{const x=$('#xclose');x&&x.focus({preventScroll:true})},30);
}
function openSheet(r){ov.dataset.id=r.id;ov.dataset.serv=r.serv;openOverlay('recipe',sheetHTML(r,r.serv),rName(r))}
function openSettings(){
  ov.dataset.id='';
  openOverlay('settings',settingsHTML(),t('set_title'));
}
function closeSheet(){
  if(!sheetOpen)return;
  sheetOpen=false;timers.forEach(clearInterval);timers=[];
  $('#gearBtn').setAttribute('aria-expanded','false');
  const tok=++closeToken;
  const done=()=>{if(tok!==closeToken)return;ov.hidden=true;ov.innerHTML='';ovKind=null;document.body.classList.remove('locked');if(lastFocus&&lastFocus.focus)try{lastFocus.focus({preventScroll:true})}catch(e){}};
  if(reduce){done();return}
  ov.animate([{opacity:1},{opacity:0}],{duration:200,easing:'ease-in'}).onfinish=done;
}
/* Затваряне: връща към страницата, от която си дошъл (Търсене пази думата и филтрите) */
function requestClose(){location.hash='#'+(curPage||'home')}

function beep(){try{const A=window.AudioContext||window.webkitAudioContext,c=new A(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.12,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.7);o.start();o.stop(c.currentTime+.7)}catch(e){}}
/* Преливане на бутона на таймера в нова форма (ширина и височина с пружина) */
function morph(b,fn){
  const w0=b.offsetWidth,h0=b.offsetHeight,label=b.lastElementChild;
  fn();
  if(reduce)return;
  const w1=b.offsetWidth,h1=b.offsetHeight;
  b.animate([{width:w0+'px',height:h0+'px'},{width:w1+'px',height:h1+'px'}],{duration:620,easing:'cubic-bezier(.3,1.45,.45,1)'});
  label.animate([{opacity:0,transform:'translateY(5px)'},{opacity:1,transform:'none'}],{duration:300,delay:140,easing:'ease-out',fill:'backwards'});
}
const mmss=sec=>pad2(Math.floor(sec/60))+':'+pad2(sec%60);
function runTimer(b){
  const label=b.lastElementChild,idle=`${t('timer')} ${b.dataset.min}${nbsp}${t('min')}`;
  if(b._iv){clearInterval(b._iv);b._iv=null;morph(b,()=>{b.classList.remove('run','fin');b.style.removeProperty('--p');label.textContent=idle});return}
  if(b.classList.contains('fin')){morph(b,()=>{b.classList.remove('fin');label.textContent=idle});return}
  const total=b.dataset.min*60000,end=Date.now()+total;
  morph(b,()=>{b.classList.add('run');b.style.setProperty('--p',1);label.textContent=mmss(b.dataset.min*60)});
  const tick=()=>{
    const ms=Math.max(0,end-Date.now()),left=Math.ceil(ms/1000);
    label.textContent=mmss(left);
    b.style.setProperty('--p',(ms/total).toFixed(4));
    if(ms<=0){clearInterval(b._iv);b._iv=null;morph(b,()=>{b.classList.remove('run');b.classList.add('fin');b.style.removeProperty('--p');label.textContent=t('timer_done')});beep()}
  };
  b._iv=setInterval(tick,500);timers.push(b._iv);
}

/* ==========================================================================
   Навигация: долна лента със стъклен палец
   ========================================================================== */
const PAGES=['home','zakuska','obyad','vecherya','tarsene','hladilnik'];
const NAV={home:'home',zakuska:'sunrise',obyad:'sun',vecherya:'moon',tarsene:'search',hladilnik:'fridge'};
const thumb=$('#thumb');let thumbX=null,curPage=null;
$$('.dk').forEach(a=>a.innerHTML=ic(NAV[a.dataset.p]));
$('#logo').innerHTML=ic('logo');
$('#gearBtn').innerHTML=ic('gear');
$$('.sicon').forEach(s=>s.innerHTML=ic(s.dataset.i));

function applyStatic(){
  root.lang=L;
  document.title=t('brand');
  const br=$('.brand');br.setAttribute('aria-label',t('brand_aria'));br.lastElementChild.textContent=t('brand');
  $('#themeSw legend').textContent=t('theme');
  const lab=$$('.so');
  lab[0].title=t('theme_light');lab[0].firstElementChild.setAttribute('aria-label',t('theme_light'));
  lab[1].title=t('theme_dark');lab[1].firstElementChild.setAttribute('aria-label',t('theme_dark'));
  $('#gearBtn').setAttribute('aria-label',t('settings'));$('#gearBtn').title=t('settings');
  $('#dock').setAttribute('aria-label',t('main_menu'));
  PAGES.forEach(p=>{$('.dk[data-p="'+p+'"]').setAttribute('aria-label',t('nav_'+p));$('#page-'+p).setAttribute('aria-label',t('nav_'+p))});
}

function placeThumb(animate){
  const a=$('.dk[aria-current="page"]');if(!a)return;
  const w=a.offsetWidth,tw=w+14,x=Math.round(a.offsetLeft+w/2-tw/2);
  thumb.style.width=tw+'px';
  if(animate&&!reduce&&thumbX!==null&&thumbX!==x){
    thumb.style.transition='translate .5s cubic-bezier(1,0,.4,1)';
    thumb.style.translate=x+'px 0';
    thumb.animate([{scale:'1 1'},{scale:'1.16 1',offset:.5},{scale:'1 1'}],{duration:480,easing:'ease'});
  }else{
    thumb.style.transition='none';thumb.style.translate=x+'px 0';
  }
  thumbX=x;
}
function showPage(name){
  if(name===curPage)return;
  const first=curPage===null;
  PAGES.forEach(p=>{$('#page-'+p).hidden=p!==name});
  $$('.dk').forEach(a=>{if(a.dataset.p===name)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  curPage=name;
  const el=$('#page-'+name);
  if(!first&&!reduce){el.classList.remove('enter');void el.offsetWidth;el.classList.add('enter')}
  if(!first)window.scrollTo(0,0);
  placeThumb(!first);
  edges();
}
let pendingFocus=false;
function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(h.startsWith('r-')&&byId[h.slice(2)]){
    const r=byId[h.slice(2)];
    if(curPage===null)showPage(r.meal);   /* пряка връзка: страницата отдолу е на същото хранене */
    openSheet(r);return;
  }
  if(h==='nastroyki'){
    if(curPage===null)showPage('home');
    openSettings();return;
  }
  closeSheet();
  const p=PAGES.includes(h)?h:'home';
  showPage(p);
  if(p==='tarsene'&&pendingFocus){pendingFocus=false;setTimeout(()=>{const q=$('#q');q&&q.focus({preventScroll:true})},60)}
}

/* Ръбове при скрол (като в iOS) */
function edges(){
  const y=window.scrollY,max=document.documentElement.scrollHeight-window.innerHeight;
  $('#edgeT').classList.toggle('on',y>6);
  $('#edgeB').classList.toggle('on',y<max-6);
}
window.addEventListener('scroll',edges,{passive:true});

/* ==========================================================================
   Тема, основен цвят, език, стъкло
   ========================================================================== */
const sw=$('#themeSw');
function setTheme(v,save,origin){
  const apply=()=>root.setAttribute('data-theme',v);
  if(save)store.set('trapeza-theme',v);
  if(origin&&document.startViewTransition&&!reduce){
    const x=origin.x,y=origin.y,r=Math.hypot(Math.max(x,window.innerWidth-x),Math.max(y,window.innerHeight-y));
    const tr=document.startViewTransition(apply);
    tr.ready.then(()=>root.animate({clipPath:[`circle(0px at ${x}px ${y}px)`,`circle(${r}px at ${x}px ${y}px)`]},{duration:800,easing:'cubic-bezier(.3,0,.15,1)',pseudoElement:'::view-transition-new(root)'})).catch(()=>{});
  }else apply();
}
(function initTheme(){
  const th=store.get('trapeza-theme','dark')==='light'?'light':'dark';
  setTheme(th,false);
  $$('.si',sw).forEach(i=>{i.checked=i.value===th});
  sw.setAttribute('c-previous',th==='light'?'1':'2');
  let prev=th==='light'?'1':'2';
  $$('.si',sw).forEach(i=>i.addEventListener('change',()=>{
    if(!i.checked)return;
    sw.setAttribute('c-previous',prev);prev=i.getAttribute('c-option');
    const b=i.closest('.so').getBoundingClientRect();
    setTheme(i.value,true,{x:b.left+b.width/2,y:b.top+b.height/2});
  }));
})();

const SWATCHES=[[355,'c_red'],[24,'c_orange'],[46,'c_yellow'],[145,'c_green'],[188,'c_cyan'],[215,'c_blue'],[268,'c_violet'],[328,'c_pink']];
function onAccent(h){
  const s=.9,l=.56,a=s*Math.min(l,1-l),k=n=>(n+h/30)%12;
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  const [r,g,b]=[f(0),f(8),f(4)].map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));
  const Lm=.2126*r+.7152*g+.0722*b;
  return (1.05/(Lm+.05))>=((Lm+.05)/.05)?'#fff':'#000';
}
let hue=+store.get('trapeza-hue',355);
function setHue(h,save){
  hue=Math.max(0,Math.min(360,Math.round(h)));
  root.style.setProperty('--h',hue);
  root.style.setProperty('--on-accent',onAccent(hue));
  const ht=$('.hthumb');if(ht){ht.style.setProperty('--v',hue/3.6);ht.setAttribute('aria-valuenow',hue)}
  $$('.sw').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.h===hue));
  if(save)store.set('trapeza-hue',hue);
}
setHue(hue,false);

/* Стъкло: „Леко“ (по подразбиране) или „Силно“ (WebGL) */
let glassMode='light',glassFail=false;
function setGlass(m,save){
  if(m==='strong'){
    if(GL.start())glassFail=false;
    else{glassFail=true;m='light'}
  }else{GL.stop();glassFail=false}
  glassMode=m;
  if(save&&!glassFail)store.set('trapeza-glass',m);
  if(ovKind==='settings')refreshSettings();
}
GL.onFail(()=>{glassFail=true;glassMode='light';if(ovKind==='settings')refreshSettings()});
function refreshSettings(){
  const keep=ov.scrollTop,fe=document.activeElement&&document.activeElement.dataset?{k:Object.keys(document.activeElement.dataset)[0],v:document.activeElement.dataset[Object.keys(document.activeElement.dataset)[0]]}:null;
  ov.setAttribute('aria-label',t('set_title'));
  ov.innerHTML=settingsHTML();ov.scrollTop=keep;
  if(fe&&fe.k){const el=$(`[data-${fe.k}="${fe.v}"]`,ov);el&&el.focus({preventScroll:true})}
}

function rebuildAll(){
  applyStatic();
  buildHome();MKEYS.forEach(buildMeal);buildSearch();buildFridge();
  placeThumb(false);edges();
}
function setLang(l,save){
  if(l===L)return;
  L=l;if(save)store.set('trapeza-lang',L);
  nopen=null;
  rebuildAll();
  if(ovKind==='settings')refreshSettings();
}

/* ==========================================================================
   События
   ========================================================================== */
/* Плъзгачи за хранителни стойности */
let drag=null;
function valueAt(k,x,rng){
  const b=rng.getBoundingClientRect(),p=Math.max(0,Math.min(1,(x-b.left)/b.width));
  if(k==='h')return p*360;
  return NR[k][0]+p*(NR[k][1]-NR[k][0]);
}
document.addEventListener('pointerdown',e=>{
  const rng=e.target.closest&&e.target.closest('.rng');if(!rng)return;
  if(rng.hasAttribute('data-hrng')){
    const th=$('.hthumb',rng);
    e.preventDefault();
    setHue(valueAt('h',e.clientX,rng),true);
    drag={hue:true,rng,th,id:e.pointerId};
    th.classList.add('active');
    try{th.setPointerCapture(e.pointerId)}catch(_){}
    return;
  }
  const k=rng.dataset.rng;
  let th=e.target.closest('.rthumb');
  if(!th){
    const v=valueAt(k,e.clientX,rng),which=Math.abs(v-nv[k][0])<=Math.abs(v-nv[k][1])?0:1;
    th=$$('.rthumb',rng)[which];setNut(k,which,v);
  }
  e.preventDefault();
  drag={k,which:+th.dataset.h,rng,th,id:e.pointerId};
  th.classList.add('active');
  try{th.setPointerCapture(e.pointerId)}catch(_){}
});
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  if(drag.hue){setHue(valueAt('h',e.clientX,drag.rng),true);return}
  setNut(drag.k,drag.which,valueAt(drag.k,e.clientX,drag.rng));
});
const endDrag=e=>{if(drag&&e.pointerId===drag.id){drag.th.classList.remove('active');drag=null}};
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);
document.addEventListener('keydown',e=>{
  const th=e.target.closest&&e.target.closest('.rthumb');
  if(!th)return;
  if(th.closest('[data-hrng]')){
    const d=e.shiftKey?10:1;let v=null;
    if(e.key==='ArrowLeft'||e.key==='ArrowDown')v=hue-d;
    else if(e.key==='ArrowRight'||e.key==='ArrowUp')v=hue+d;
    else if(e.key==='Home')v=0;else if(e.key==='End')v=360;
    if(v!=null){e.preventDefault();setHue(v,true)}
    return;
  }
  const k=th.closest('.rng').dataset.rng,which=+th.dataset.h,st=NM.find(x=>x[0]===k)[4],cur=nv[k][which];
  let v=null;
  if(e.key==='ArrowLeft'||e.key==='ArrowDown')v=cur-st*(e.shiftKey?10:1);
  else if(e.key==='ArrowRight'||e.key==='ArrowUp')v=cur+st*(e.shiftKey?10:1);
  else if(e.key==='PageDown')v=cur-st*10;
  else if(e.key==='PageUp')v=cur+st*10;
  else if(e.key==='Home')v=NR[k][0];
  else if(e.key==='End')v=NR[k][1];
  if(v==null)return;
  e.preventDefault();setNut(k,which,v);
},true);

document.addEventListener('click',e=>{
  const tg=e.target;
  const a=tg.closest&&tg.closest('a[href^="#r-"]');
  if(a){const c=a.closest('.card,.feature,.frow');lastRect=(c||a).getBoundingClientRect()}
  let el;
  if((el=tg.closest('#gearBtn'))){lastRect=el.getBoundingClientRect();location.hash=sheetOpen&&ovKind==='settings'?'#'+(curPage||'home'):'#nastroyki';return}
  if((el=tg.closest('[data-fav]'))){e.preventDefault();toggleFav(el.dataset.fav);return}
  if(tg.closest('#xclose')){requestClose();return}
  if(tg===ov){requestClose();return}
  if((el=tg.closest('[data-st]'))){
    const r=byId[ov.dataset.id];let s=Math.min(12,Math.max(1,(+ov.dataset.serv)+(+el.dataset.st)));
    ov.dataset.serv=s;$('#sv').textContent=s;$('#il').innerHTML=ingList(r,s);$('#ntot').innerHTML=totalLine(r,s);return}
  if((el=tg.closest('.chk'))){const li=el.closest('li');const d=li.classList.toggle('done');el.setAttribute('aria-pressed',d);return}
  if((el=tg.closest('.tm'))){runTimer(el);return}
  if((el=tg.closest('.sw'))){setHue(+el.dataset.h,true);return}
  if((el=tg.closest('[data-lang]'))){setLang(el.dataset.lang,true);return}
  if((el=tg.closest('[data-glass]'))){setGlass(el.dataset.glass,true);return}
  if((el=tg.closest('#shuffle'))){
    const m=nowMeal(),r=pickFeature(m,featId);featId=r.id;
    const f=$('#feature');f.innerHTML=featureHTML(r,m);
    if(!reduce)f.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:340,easing:'ease-out'});
    return}
  if((el=tg.closest('#fclear'))){fsel.clear();renderFridge();return}
  if((el=tg.closest('[data-k]'))){const k=el.dataset.k;fsel.has(k)?fsel.delete(k):fsel.add(k);renderFridge();return}
  if((el=tg.closest('[data-nreset]'))){const k=el.dataset.nreset;nv[k]=NR[k].slice();syncNut(k);renderSearch();return}
  if((el=tg.closest('.nhead'))){toggleNut(el.closest('.nitem').dataset.n);return}
  if((el=tg.closest('.chip[data-f]'))){const pg=el.closest('.page'),m=pg.id.replace('page-','');mf[m][el.dataset.f]=!mf[m][el.dataset.f];renderMeal(m);return}
  if((el=tg.closest('.chip[data-m]'))){
    const m=el.dataset.m;
    if(m==='all')sst.meals.clear();else sst.meals.has(m)?sst.meals.delete(m):sst.meals.add(m);
    renderSearch();return}
  if((el=tg.closest('.chip[data-s]'))){sst[el.dataset.s]=!sst[el.dataset.s];renderSearch();return}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){sst.q=e.target.value;renderSearch()}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='homeSearch'){sst.q=$('#hq').value;const q=$('#q');if(q)q.value=sst.q;renderSearch();pendingFocus=true;location.hash='#tarsene'}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!sheetOpen&&nopen){const k=nopen;toggleNut(k);const h=$(`.nitem[data-n="${k}"] .nhead`);h&&h.focus();return}
  if(!sheetOpen)return;
  if(e.key==='Escape'){requestClose();return}
  if(e.key==='Tab'){
    const f=$$('button,a[href],input',ov).filter(x=>!x.disabled&&x.offsetParent!==null);if(!f.length)return;
    const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
  }
});
/* Светлина по стъклото при движение на мишката */
let raf=0;
document.addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse'||drag)return;
  const g=e.target.closest&&e.target.closest('.glass');if(!g)return;
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(()=>{const b=g.getBoundingClientRect();g.style.setProperty('--mx',(e.clientX-b.left)+'px');g.style.setProperty('--my',(e.clientY-b.top)+'px')});
});
window.addEventListener('hashchange',route);
window.addEventListener('resize',()=>{placeThumb(false);edges()});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{placeThumb(false);edges()});

/* Старт */
applyStatic();
buildHome();MKEYS.forEach(buildMeal);buildSearch();buildFridge();
route();
if(store.get('trapeza-glass','light')==='strong')setGlass('strong',false);

})();
